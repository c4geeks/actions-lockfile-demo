name: ci
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: c4geeks/actions-lockfile-demo-tag@v1.0.0
      - uses: $/.github/actions/report
      - uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: README.md
